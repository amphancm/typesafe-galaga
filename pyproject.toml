[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typesafe-galaga"
version = "0.1.0"
description = "A direct-control TypeSafe/Jev agent for NES Galaga."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "typesafe-sdk",
]

[project.optional-dependencies]
galaga = [
  "gymnasium",
  "nes-py>=9.0.1",
  "numpy>=2.1",
  "pygame-ce>=2.5.8",
]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]
rl = [
  "stable-baselines3>=2.4.0",
  "tensorboard>=2.18.0",
  "torch>=2.5.0",
]

[project.scripts]
typesafe-galaga = "typesafe_galaga.cli:main"

[project.urls]
Repository = "https://github.com/amphancm/typesafe-galaga"

[tool.hatch.build.targets.wheel]
packages = ["src/typesafe_galaga"]

[tool.ruff]
line-length = 100
target-version = "py313"
